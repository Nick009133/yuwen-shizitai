<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文识字台 · 一~六年级（蜡笔暖阳）</title>
<!--
  Discovery（方向C · 蜡笔暖阳 · 依据补充任务书）:
    deliverable: 儿童识字工作台 · 单文件可交互应用（数据 = shengzi-data.js / window.YUWEN_DATA，278 字 4 组 39 课）
    direction: 课本封面"蜡笔化"——大面积暖橙阳光 + 贴纸卡片（粗描边/微旋转/投影）+ 手绘 SVG（太阳·风筝·蝴蝶·秋叶）+ 波浪线/虚线蜡笔质感
    palette: 暖橙 #F2A63C / 橘橙 #E8823C / 草绿 #8FBB5F / 天空蓝 #A9CFE8 / 砖红 #D0452A / 米白卡片（文字均用加深色保对比度）
    interactions: 首页4大板块贴纸卡 → 课次列表 → 字卡网格（按课分页挂载）；点卡翻转(3D)+朗读；贴纸式"我会了"；每课5题听音选字(3选1)+星星彩带；年级切换(二~六年级灰态)；复习=随机抽查
    engineering: 触控≥56px / 主字≥64px / 拼音≥18px / localStorage 前缀 yuwenG1_ / 无 emoji（内联 SVG）/ prefers-reduced-motion / 焦点可见
-->
<style>
:root{
  /* 蜡笔暖阳调色板（取自课本封面识图） */
  --sun:#f2a63c;          /* 暖橙 · 大面积主色 */
  --orange:#e8823c;       /* 橘橙 · 主 CTA */
  --grass:#8fbb5f;        /* 草绿 */
  --sky:#a9cfe8;          /* 天空蓝 */
  --brick:#d0452a;        /* 砖红 */
  --bg:#fbf1de;           /* 暖米纸底 */
  --surface:#fffdf6;      /* 米白卡片 */
  --ink:#46372a;          /* 深蜡笔棕 */
  --ink-deep:#3d2b1c;
  --ink-soft:#7a6244;     /* 次级文字（≥4.5:1） */
  --card-line:#e0c692;    /* 蜡笔粗描边 */
  --line:#ecd9b4;
  --accent-deep:#a34e0f;  /* 橙色系文字用（对比达标） */
  --sun-deep:#9c6a10;
  --grass-deep:#4f7a2b;
  --sky-deep:#2f6b93;
  --brick-deep:#a83220;
  --grass-soft:#e4efdb;
  --sky-soft:#ddebf4;
  --brick-soft:#f9dfd6;
  --sun-soft:#ffe7c4;
  --orange-soft:#ffe3c8;
  --radius:18px;
  --radius-lg:22px;
  --shadow:0 5px 16px rgba(70,55,42,.12);
  --shadow-lift:0 10px 26px rgba(70,55,42,.16);
  --tianline:#ecd3a6;
  --tianline-strong:#dcbd85;
  --crayon-streak:repeating-linear-gradient(-55deg, rgba(255,255,255,.42) 0 5px, rgba(255,255,255,0) 5px 11px);
  --font-kai:"Kaiti SC","KaiTi","STKaiti","DFKai-SB",serif;
  --font-ui:"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
  --ease-spring:cubic-bezier(.34,1.45,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(ellipse 70% 46% at 82% -6%, rgba(242,166,60,.34), transparent 62%),
    radial-gradient(ellipse 52% 36% at -6% 16%, rgba(169,207,232,.30), transparent 60%),
    radial-gradient(ellipse 60% 40% at 108% 78%, rgba(143,187,95,.16), transparent 62%),
    var(--bg);
  color:var(--ink);font:15px/1.6 var(--font-ui);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
button:disabled{cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:10px}
.app{position:relative;max-width:1080px;margin:0 auto;padding:26px 22px 96px;overflow-x:clip}

/* ============ 手绘涂鸦装饰（太阳·风筝·蝴蝶·秋叶） ============ */
.doodle{position:absolute;pointer-events:none;z-index:0}
.doodle svg{display:block}
.doodle-sun{top:14px;right:18px;opacity:.95}
.doodle-kite{top:338px;right:26px;opacity:.8}
.doodle-butterfly{bottom:120px;left:14px;opacity:.75}
.doodle-leaf{bottom:34px;right:44px;opacity:.7}
@media (max-width:720px){.doodle-kite,.doodle-butterfly{display:none}.doodle-sun{transform:scale(.72);transform-origin:top right}}
@media (prefers-reduced-motion: reduce){.doodle-float{animation:none !important}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.doodle-float{animation:floaty 7s ease-in-out infinite}

/* ============ 头部 ============ */
header.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--font-kai);font-size:clamp(30px,5vw,44px);line-height:1.12;color:var(--ink-deep)}
.brand h1 .alt{color:var(--accent-deep)}
.brand .sub{margin:6px 0 0;color:var(--ink-soft);font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wave-u{display:inline-block;vertical-align:baseline}

/* ============ 年级切换 ============ */
.grades{position:relative;z-index:1;display:flex;gap:9px;margin:18px 0 4px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.grade-pill{
  flex-shrink:0;min-height:56px;padding:8px 18px;border-radius:999px;white-space:nowrap;
  border:2.5px solid var(--card-line);background:var(--surface);color:var(--ink);
  font-size:14.5px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;
  box-shadow:var(--shadow);transition:transform .15s var(--ease),border-color .15s;
}
.grade-pill:hover{transform:translateY(-2px)}
.grade-pill .gp-tag{font-size:10.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.grade-pill[aria-pressed="true"]{background:var(--sun);border-color:var(--sun-deep);color:var(--ink-deep)}
.grade-pill[aria-pressed="true"] .gp-tag{color:var(--sun-deep)}
.grade-pill[aria-disabled="true"]{background:transparent;border-style:dashed;color:#8a755b;box-shadow:none;font-weight:600}
.grade-pill[aria-disabled="true"]:hover{transform:none;border-color:#c9b28a}
.grade-pill svg{width:15px;height:15px;flex-shrink:0}

/* ============ 识字罗盘（暖橙大面积徽带） ============ */
.badge-strip{
  position:relative;z-index:1;margin:14px 0 8px;padding:18px 22px;border-radius:24px;overflow:hidden;
  background:linear-gradient(150deg,var(--sun) 0%,var(--orange) 100%);
  background-image:var(--crayon-streak),linear-gradient(150deg,var(--sun) 0%,var(--orange) 100%);
  color:var(--ink-deep);box-shadow:var(--shadow);border:2.5px solid rgba(61,43,28,.22);
}
.badge-strip .row1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.badge-strip .hi{font-size:15.5px;font-weight:700}
.badge-strip .hi b{font-family:var(--font-kai);font-size:21px}
.badge-strip .stat{font-size:12.5px;color:rgba(61,43,28,.82);letter-spacing:.02em}
.bar{height:13px;border-radius:999px;background:rgba(61,43,28,.20);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--ink-deep);background-image:var(--crayon-streak);transition:width .6s var(--ease)}
.meter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.meter{background:rgba(255,253,246,.36);border:2px solid rgba(61,43,28,.20);border-radius:15px;padding:10px 13px;min-width:0}
.meter .k{font-size:11.5px;font-weight:700;color:rgba(61,43,28,.85);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .v{font-size:19px;font-weight:800;font-family:var(--font-kai);margin-top:2px}
.meter .v small{font-size:11px;font-weight:600;color:rgba(61,43,28,.7);font-family:var(--font-ui)}
.meter .bar{margin-top:8px;height:9px}
.meter .bar>i{background:var(--ink-deep)}

/* ============ 主导航（蜡笔下划线） ============ */
.tabs{position:relative;z-index:1;display:flex;gap:8px;margin:16px 0 20px;border-bottom:2.5px solid var(--card-line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  min-height:56px;padding:12px 18px;font-size:15.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);
  border-radius:14px 14px 0 0;position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:color .15s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink-deep)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:14px;right:14px;bottom:-4px;height:5px;border-radius:999px;background:var(--orange);
}
.tab .cnt{font-size:11.5px;font-weight:700;background:var(--grass-soft);color:var(--grass-deep);border-radius:999px;padding:3px 9px}

/* ============ 首页 · 4 大板块贴纸卡 ============ */
.view{display:none}
.view.active{display:block;animation:pop .3s var(--ease) both}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:scale(1);opacity:1}}
.sec-title{position:relative;z-index:1;margin:8px 0 14px;font-family:var(--font-kai);font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title small{font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);font-weight:400}
.group-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.group-card{
  --tilt:0deg;position:relative;text-align:left;background:var(--surface);
  border:2.5px solid var(--gc-line,var(--card-line));border-radius:var(--radius-lg);
  padding:20px 20px 18px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:8px;min-height:172px;
  transform:rotate(var(--tilt));transition:transform .2s var(--ease-spring),box-shadow .2s;
}
.group-card:nth-child(4n+1){--tilt:-1.2deg}
.group-card:nth-child(4n+2){--tilt:.9deg}
.group-card:nth-child(4n+3){--tilt:-.7deg}
.group-card:nth-child(4n+4){--tilt:1.3deg}
.group-card:hover{transform:rotate(0) translateY(-3px);box-shadow:0 14px 30px rgba(70,55,42,.18)}
.group-card:active{transform:rotate(0) translateY(-1px) scale(.985)}
.group-card .gc-chip{
  align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--gc-deep,var(--accent-deep));
  background:var(--gc-soft,var(--sun-soft));border:2px dashed var(--gc-deep,var(--accent-deep));
  border-radius:999px;padding:4px 12px;
}
.group-card h3{margin:2px 0 0;font-family:var(--font-kai);font-size:23px;color:var(--ink-deep);display:flex;align-items:center;gap:8px}
.group-card h3 .gc-doodle{width:26px;height:26px;color:var(--gc-deep,var(--accent-deep));flex-shrink:0}
.group-card p{margin:0;font-size:12.5px;color:var(--ink-soft)}
.group-card .gc-bar{margin-top:auto}
.gc-bar .bar{height:11px;background:var(--bg)}
.gc-bar .bar>i{background:var(--gc-main,var(--sun));background-image:var(--crayon-streak)}
.gc-bar .gc-bar-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:5px;font-weight:600}
.gc-bar .gc-bar-meta .stars{display:inline-flex;align-items:center;gap:4px;color:var(--sun-deep)}
.gc-bar .gc-bar-meta .stars svg{width:14px;height:14px}
.group-card .gc-go{
  position:absolute;right:16px;bottom:14px;width:44px;height:44px;border-radius:50%;
  background:var(--gc-main,var(--sun));color:var(--ink-deep);display:grid;place-items:center;
  border:2.5px solid rgba(61,43,28,.25);transition:transform .2s var(--ease-spring);
}
.group-card:hover .gc-go{transform:translateX(3px) rotate(-8deg)}
.group-card .gc-go svg{width:19px;height:19px}

/* 复习入口卡 */
.review-cta{
  position:relative;z-index:1;margin-top:20px;width:100%;text-align:left;
  border:2.5px solid var(--grass);border-radius:var(--radius-lg);background:linear-gradient(150deg,var(--grass-soft),var(--surface) 72%);
  box-shadow:var(--shadow);padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  transition:transform .18s var(--ease),box-shadow .18s;
}
.review-cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.review-cta .rc-art{width:54px;height:54px;border-radius:50%;background:var(--grass);color:#fffdf6;display:grid;place-items:center;flex-shrink:0;border:2.5px solid var(--grass-deep)}
.review-cta .rc-art svg{width:25px;height:25px}
.review-cta .rc-txt{flex:1;min-width:200px}
.review-cta .rc-txt h3{margin:0;font-family:var(--font-kai);font-size:19px}
.review-cta .rc-txt p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft)}
.review-cta .rc-n{font-family:var(--font-kai);font-size:30px;font-weight:800;color:var(--grass-deep)}
.review-cta .rc-n small{font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);font-weight:600}

/* ============ 学一学 · 课次列表 ============ */
.subhead{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.subhead h2{margin:0;font-size:25px;font-family:var(--font-kai);color:var(--ink-deep)}
.subhead h2 .u-label{display:inline-block;font-size:12px;font-family:var(--font-ui);font-weight:800;letter-spacing:.05em;color:var(--gc-deep,var(--accent-deep));background:var(--gc-soft,var(--sun-soft));border-radius:999px;padding:4px 11px;margin-right:10px;vertical-align:4px}
.subhead p{margin:5px 0 0;font-size:13px;color:var(--ink-soft)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 24px;
  border-radius:999px;font-size:15px;font-weight:700;letter-spacing:.02em;border:2.5px solid transparent;
  transition:transform .15s var(--ease),background .15s,border-color .15s,box-shadow .15s;
}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.primary{background:var(--orange);color:var(--ink-deep);border-color:rgba(61,43,28,.28);box-shadow:0 4px 12px rgba(232,130,60,.35)}
.btn.primary:hover{background:#ef904e;box-shadow:0 6px 16px rgba(232,130,60,.42)}
.btn.ghost{border-color:var(--card-line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:var(--orange);color:var(--accent-deep)}
.btn.grass{background:var(--grass);color:#fffdf6;border-color:var(--grass-deep)}
.btn.grass:hover{background:#9cc870}
.btn.quiet{border:2.5px dashed var(--card-line);color:var(--ink-soft);background:transparent}
.btn.quiet:hover{color:var(--ink);border-color:var(--ink-soft)}

.unit-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.unit-card{
  --tilt:0deg;position:relative;text-align:left;background:var(--surface);
  border:2.5px solid var(--uc-line,var(--card-line));border-radius:var(--radius-lg);
  padding:16px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;min-height:126px;
  transform:rotate(var(--tilt));transition:transform .2s var(--ease-spring),box-shadow .2s,border-color .15s;
}
.unit-card:nth-child(4n+1){--tilt:-1.1deg}
.unit-card:nth-child(4n+2){--tilt:.8deg}
.unit-card:nth-child(4n+3){--tilt:-.5deg}
.unit-card:nth-child(4n+4){--tilt:1.2deg}
.unit-card:hover{transform:rotate(0) translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--uc-main,var(--sun))}
.unit-card:active{transform:rotate(0) translateY(-1px) scale(.985)}
.unit-card .u-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.unit-card .u-label{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--uc-deep,var(--accent-deep))}
.unit-card .u-star{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.unit-card .u-star svg{width:17px;height:17px}
.unit-card .u-star.earned{color:var(--sun-deep)}
.unit-card h3{margin:0;font-size:19px;font-family:var(--font-kai);color:var(--ink-deep)}
.unit-card .u-meta{margin-top:auto}
.unit-card .u-meta .bar{height:10px;background:var(--bg)}
.unit-card .u-meta .bar>i{background:var(--uc-main,var(--sun));background-image:var(--crayon-streak)}
.unit-card .u-meta .u-nums{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:5px;font-weight:600}
.unit-card .u-nums .done{color:var(--grass-deep)}

/* ============ 学一学 · 某一课（按课次分页渲染） ============ */
.lesson-bar{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.pager-btns{display:flex;gap:8px}
.pager-btn{
  min-height:56px;padding:10px 16px;border-radius:999px;border:2.5px solid var(--card-line);background:var(--surface);
  font-size:13.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px;
  transition:border-color .15s,color .15s,transform .15s var(--ease);
}
.pager-btn:hover:not(:disabled){border-color:var(--orange);color:var(--accent-deep);transform:translateY(-1px)}
.pager-btn:disabled{opacity:.4}
.pager-btn svg{width:16px;height:16px}
.lesson-pos{font-size:12.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em}

.lesson-head{
  position:relative;z-index:1;border:2.5px solid var(--card-line);border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
}
.lesson-head h2{margin:0;font-family:var(--font-kai);font-size:24px;color:var(--ink-deep)}
.lesson-head .lh-meta{margin:5px 0 0;font-size:12.5px;color:var(--ink-soft)}
.lesson-head .lh-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lh-star{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.lh-star svg{width:20px;height:20px}
.lh-star.earned{color:var(--sun-deep)}

/* ============ 字卡（翻转贴纸） ============ */
.char-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px;margin-top:4px}
.char-card{--tilt:0deg;perspective:900px;background:none;border:none;min-height:216px;transform:rotate(var(--tilt));transition:transform .2s var(--ease-spring)}
.char-card:nth-child(4n+1){--tilt:-1.3deg}
.char-card:nth-child(4n+2){--tilt:1deg}
.char-card:nth-child(4n+3){--tilt:-.6deg}
.char-card:nth-child(4n+4){--tilt:1.4deg}
.char-card:hover{transform:rotate(0)}
.cc-inner{position:relative;width:100%;height:216px;transform-style:preserve-3d;transition:transform .5s var(--ease-spring)}
.char-card.flipped .cc-inner{transform:rotateY(180deg)}
.char-card.bounce .cc-inner{animation:flipBounce .5s var(--ease-spring)}
@keyframes flipBounce{0%{transform:rotateY(180deg) scale(.94)}55%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:2.5px solid var(--cc-line,var(--card-line));border-radius:var(--radius-lg);background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 10px;
}
.face.back{transform:rotateY(180deg);justify-content:center;gap:8px}
.char-card.s-known .face{--cc-line:var(--grass);background:linear-gradient(180deg,var(--grass-soft),var(--surface) 64%)}
.char-card.s-unknown .face{--cc-line:var(--brick);background:linear-gradient(180deg,var(--brick-soft),var(--surface) 64%)}
.face .tian{
  width:86px;height:86px;border-radius:14px;background:#fff;flex-shrink:0;
  background-image:
    linear-gradient(var(--tianline) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--tianline) 1.5px,transparent 1.5px),
    linear-gradient(45deg,transparent calc(50% - .8px),var(--tianline-strong) calc(50% - .8px),var(--tianline-strong) calc(50% + .8px),transparent calc(50% + .8px)),
    linear-gradient(-45deg,transparent calc(50% - .8px),var(--tianline-strong) calc(50% - .8px),var(--tianline-strong) calc(50% + .8px),transparent calc(50% + .8px));
  display:grid;place-items:center;
}
.face .han{font-family:var(--font-kai);font-weight:700;font-size:64px;line-height:1;color:var(--ink-deep)}
.face .py{font-size:18px;font-weight:700;color:var(--accent-deep);margin-top:3px}
.face .tap-hint{font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;margin-top:2px}
.sticker-check{

@keyframes stickerPop{0%{transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(8deg)}}

/* 卡背面：组词 + 笔画 + 朗读 + 我会了 */
.face.back .bk-word{font-family:var(--font-kai);font-size:27px;font-weight:700;color:var(--ink-deep)}

.face.back .bk-py{font-size:15px;color:var(--ink-soft);font-weight:600}
.face.back .bk-stroke{font-size:12px;color:var(--ink-soft);background:var(--bg);border:2px dashed var(--card-line);border-radius:999px;padding:4px 12px;font-weight:700}

.chip-btn{

.chip-btn.ok:hover{border-color:var(--grass-deep)}

/* ============ 测验（听音选字 3 选 1 · 每课 5 题） ============ */
.quiz-shell{position:relative;z-index:1;max-width:620px;margin:0 auto}
.quiz-card{position:relative;border:2.5px solid var(--card-line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lift);padding:22px 22px 18px;overflow:hidden}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em;font-weight:700}
.quiz-dots{display:flex;gap:6px;margin-top:9px;justify-content:center}
.qdot{width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--card-line)}
.qdot.cur{background:var(--sun);border-color:var(--sun-deep)}
.qdot.hit{background:var(--grass);border-color:var(--grass-deep)}
.qdot.miss{background:var(--brick);border-color:var(--brick-deep)}
.listen-zone{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 16px}
.listen-btn{
  width:96px;height:96px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-deep);
  color:var(--ink-deep);display:grid;place-items:center;box-shadow:0 6px 16px rgba(242,166,60,.4);
  transition:transform .18s var(--ease-spring);
}
.listen-btn:hover{transform:scale(1.06) rotate(-3deg)}
.listen-btn:active{transform:scale(.94)}
.listen-btn svg{width:40px;height:40px}
.listen-btn.playing{animation:listenPulse 1s ease-in-out infinite}
@keyframes listenPulse{0%,100%{box-shadow:0 6px 16px rgba(242,166,60,.4)}50%{box-shadow:0 6px 26px rgba(242,166,60,.75)}}
.listen-label{font-size:15px;font-weight:700;color:var(--ink)}
.listen-sub{font-size:12px;color:var(--ink-soft)}
.py-fallback{font-size:14px;font-weight:700;color:var(--sky-deep);background:var(--sky-soft);border:2px dashed var(--sky-deep);border-radius:999px;padding:6px 16px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{
  min-height:96px;border-radius:18px;border:2.5px solid var(--card-line);background:var(--bg);
  font-family:var(--font-kai);font-size:44px;font-weight:700;color:var(--ink-deep);
  display:grid;place-items:center;transition:border-color .15s,background .15s,transform .12s var(--ease);
}
.opt:hover{border-color:var(--orange);background:var(--surface)}
.opt:active{transform:scale(.95)}
.opt.right{border-color:var(--grass);background:var(--grass-soft);color:var(--grass-deep)}
.opt.wrong{border-color:var(--brick);background:var(--brick-soft);color:var(--brick-deep)}
.opt.reveal{border-color:var(--grass);background:var(--grass-soft);color:var(--grass-deep)}
.quiz-feed{min-height:34px;margin-top:15px;text-align:center;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.quiz-feed svg{width:18px;height:18px;flex-shrink:0}
.quiz-feed.good{color:var(--grass-deep)}
.quiz-feed.bad{color:var(--brick-deep)}
.quiz-actions{display:flex;justify-content:center;margin-top:10px}
.confetti-host{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti-host i{
  position:absolute;left:50%;top:38%;width:10px;height:14px;border-radius:3px;
  animation:confetti .85s var(--ease) forwards;
}
@keyframes confetti{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.7);opacity:0}
}
.quiz-done{padding:8px 0 4px;text-align:center;position:relative}
.quiz-done .medal{
  width:92px;height:92px;margin:2px auto 12px;border-radius:50%;background:var(--sun-soft);
  border:3px solid var(--sun);display:grid;place-items:center;color:var(--sun-deep);
}
.quiz-done .medal svg{width:44px;height:44px}
.quiz-done .medal .big-star{animation:stickerPop .55s var(--ease-spring)}
.quiz-done h3{margin:0;font-family:var(--font-kai);font-size:25px;color:var(--ink-deep)}
.quiz-done .score{font-size:46px;font-weight:800;font-family:var(--font-kai);margin:6px 0 2px;color:var(--ink-deep)}
.quiz-done .score small{font-size:21px;color:var(--ink-soft);font-weight:600}
.quiz-done .star-row{display:flex;justify-content:center;gap:8px;margin:6px 0 2px}
.quiz-done .star-row svg{width:34px;height:34px;color:var(--card-line)}
.quiz-done .star-row .lit{color:var(--sun);animation:stickerPop .5s var(--ease-spring) both}
.quiz-done p{margin:6px auto 16px;color:var(--ink-soft);font-size:13.5px;max-width:42ch}
.review-list{display:flex;flex-direction:column;gap:9px;text-align:left;margin:4px 0 18px}
.rv-row{display:flex;align-items:center;gap:12px;border:2.5px solid var(--brick-soft);background:#fdf4ee;border-radius:16px;padding:10px 14px}
.rv-row .han{font-family:var(--font-kai);font-size:30px;font-weight:700;width:42px;text-align:center;color:var(--brick-deep);flex-shrink:0}
.rv-row .rv-meta{font-size:12.5px;color:var(--ink-soft)}
.rv-row .rv-meta b{display:block;font-size:14.5px;color:var(--ink);font-family:var(--font-kai);font-size:17px}
.rv-row .rv-act{margin-left:auto;display:flex;gap:7px;flex-shrink:0}
.mini-btn{
  min-height:56px;padding:9px 15px;border-radius:999px;border:2.5px solid var(--card-line);background:var(--surface);
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--ink);
  transition:border-color .15s,color .15s;
}
.mini-btn:hover{border-color:var(--orange);color:var(--accent-deep)}
.mini-btn.ok{border-color:var(--grass);color:var(--grass-deep)}
.mini-btn.ok:hover{background:var(--grass-soft)}
.mini-btn svg{width:15px;height:15px}

/* ============ 复习站 ============ */
.review-hero{
  position:relative;z-index:1;border:2.5px solid var(--grass);border-radius:var(--radius-lg);
  background:linear-gradient(160deg,var(--grass-soft),var(--surface) 68%);box-shadow:var(--shadow);

}

.review-hero .rh-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tip-line{position:relative;z-index:1;margin:18px 2px 0;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.tip-line svg{width:15px;height:15px;color:var(--sun-deep);flex-shrink:0}

/* ============ 状态卡 ============ */
.state-card{
  position:relative;z-index:1;border:2.5px solid var(--card-line);border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow);padding:36px 26px;text-align:center;max-width:560px;margin:14px auto;
}
.state-card .sc-art{width:80px;height:80px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-deep);border:2.5px dashed var(--sun)}

.state-card h3{margin:0 0 6px;font-family:var(--font-kai);font-size:22px;color:var(--ink-deep)}
.state-card p{margin:0 auto 18px;font-size:13.5px;color:var(--ink-soft);max-width:42ch}

/* ============ toast ============ */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);z-index:90;
  background:var(--ink-deep);color:#fdf6e8;font-size:13.5px;font-weight:700;letter-spacing:.02em;
  border-radius:999px;padding:12px 22px;box-shadow:0 8px 24px rgba(46,34,22,.35);
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 动效降级 ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .cc-inner{transition:none}
}

/* ============ 响应式（平板优先 → 手机 / 桌面） ============ */
@media (min-width:1024px){
  .char-grid{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:820px){
  .meter-row{grid-template-columns:repeat(2,1fr)}
  .opts3{gap:10px}
}
@media (max-width:600px){
  .app{padding:18px 14px 84px}
  .char-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .char-card,.cc-inner{min-height:206px;height:206px}

  .opts3{grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{font-size:36px;min-height:84px}
  .quiz-card{padding:18px 14px 14px}

  .group-grid{grid-template-columns:1fr}

}

/* ===== 多题型补充样式 ===== */
.q-type{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent-deep,#a34e0f);background:var(--sun-soft,#ffe7c4);border-radius:999px;padding:4px 12px;margin-bottom:10px}
.q-hint{font-size:13px;color:var(--ink-soft);margin:6px 0 2px}
.q-sentence{font-size:20px;line-height:1.8;font-weight:600;margin:8px 0}
.q-sentence .blank{color:var(--accent-deep,#a34e0f);font-weight:700}
.q-sentence .filled{color:var(--grass-deep,#4f7a2b)}
.q-punct-sent{font-size:24px;font-weight:700;text-align:center;margin:14px 0;letter-spacing:.04em}

.q-pinyin{font-size:44px;font-weight:700;text-align:center;color:var(--sky-deep,#2f6b93);font-family:"PingFang SC",sans-serif;margin:10px 0 2px;letter-spacing:.06em}

.answer-line{min-height:56px;border:2px dashed var(--tianline-strong,#dcbd85);border-radius:16px;background:rgba(255,255,255,.65);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin:10px 0}
.answer-line .slot-hint{font-size:13px;color:var(--ink-soft)}
.answer-line .picked{background:var(--sun-soft,#ffe7c4);border:1.5px solid var(--tianline-strong,#dcbd85);border-radius:12px;padding:6px 12px;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chip{border:2px solid var(--tianline-strong,#dcbd85);background:#fffdf6;border-radius:14px;padding:10px 16px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.94)}
.chip.used{opacity:.32;transform:none}
.chip:not(.used):hover{border-color:var(--orange)}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opts1{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.opt.wide{width:100%;text-align:left;line-height:1.5}
.opt.best{font-size:16px;padding:12px 16px}
.opt.punct{font-size:26px;font-weight:700;min-height:64px}
.btn.sm{padding:8px 16px;font-size:14px}
.quiz-dots .qdot{width:10px;height:10px}


.rv-row.sent{align-items:center}

/* ============ 册切换（V3） ============ */

/* ============ 古诗背诵馆 / 词语积累站 / 部首归类屋 ============ */
.pm-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pm-card{--tilt:0deg;text-align:left;background:var(--surface);border:2.5px solid var(--card-line);border-radius:var(--radius-lg);
  padding:18px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:120px;
  transform:rotate(var(--tilt));transition:transform .2s var(--ease-spring),box-shadow .2s,border-color .15s;cursor:pointer}
.pm-card:nth-child(4n+1){--tilt:-1deg}.pm-card:nth-child(4n+2){--tilt:.8deg}.pm-card:nth-child(4n+3){--tilt:-.6deg}.pm-card:nth-child(4n+4){--tilt:1.1deg}
.pm-card:hover{transform:rotate(0) translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--sun)}
.pm-card.recited{border-color:var(--grass);background:linear-gradient(180deg,var(--grass-soft),var(--surface) 62%)}
.pm-card h4{margin:0;font-family:var(--font-kai);font-size:20px;color:var(--ink-deep);display:flex;align-items:center;gap:8px}
.pm-card .pm-meta{font-size:12px;color:var(--ink-soft);font-weight:600}
.pm-card .pm-line{font-size:13px;color:var(--ink-soft);font-family:var(--font-kai)}
.pm-card .pm-go{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--accent-deep)}
.poem-reader{max-width:640px;margin:0 auto}

.poem-card h3{margin:0;font-family:var(--font-kai);font-size:26px;color:var(--ink-deep)}
.poem-card .pm-author{margin:6px 0 14px;font-size:13.5px;color:var(--ink-soft);font-weight:600}
.poem-lines{font-family:var(--font-kai);font-size:21px;line-height:2;color:var(--ink-deep);margin-bottom:14px}
.poem-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.pmq-card{margin-top:14px;text-align:left;background:var(--bg);border:2px dashed var(--card-line);border-radius:18px;padding:14px 16px}
.wd-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

/* ===== 模块升级样式：笔顺/拼音/阅读/造句 ===== */
.bk-words{display:flex;flex-direction:column;gap:6px;margin:2px 0 6px}

.st-words .w{font-size:16px;font-weight:600}

.st-btns{display:flex;flex-direction:column;gap:8px}
.st-note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6}
.py-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
.py-card{border:2px solid var(--tianline);border-radius:20px;background:var(--surface);padding:16px 14px;text-align:left;cursor:pointer;position:relative}
.py-card h4{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.py-card .py-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.py-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;line-height:1.55}
.py-card .py-go{font-size:13px;font-weight:700;color:var(--orange-deep)}
.pq-shell{max-width:600px;margin:0 auto}
.pq-card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}
.pq-ask{font-size:20px;font-weight:700;text-align:center;margin:14px 0 6px;line-height:1.6}
.pq-tip{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:8px}
.pq-opts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.pq-opts .opt{width:100%;text-align:left;font-size:17px;padding:12px 16px}
.pq-feed{min-height:28px}
.py-stars-row{display:flex;gap:6px;margin-top:8px}
.rd-sect{margin:0 0 26px}
.rd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.rd-head h2{font-size:20px;display:flex;align-items:center;gap:8px}
.rd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rd-card{border:2px solid var(--tianline);border-radius:20px;background:var(--surface);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.rd-card.readed{border-color:var(--grass)}
.rd-card .rd-tag{font-size:11.5px;font-weight:700;color:var(--orange-deep);background:var(--sun-soft);border-radius:999px;padding:3px 10px;align-self:flex-start}
.rd-card.readed .rd-tag{color:var(--grass-deep);background:var(--grass-soft)}
.rd-card h4{font-size:17px;margin:2px 0}
.rd-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.6}
.rd-card .rd-q{font-size:12.5px;font-weight:600;color:var(--sky-deep)}
.rd-reader{max-width:640px;margin:0 auto}
.rd-text{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px;font-size:19px;line-height:2;box-shadow:var(--shadow)}
.rd-text .t{font-size:15px;font-weight:700;color:var(--orange-deep);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rd-qs{margin:16px 0;display:flex;flex-direction:column;gap:12px}
.rd-q-card{background:var(--surface);border:1.5px solid var(--tianline);border-radius:18px;padding:14px}
.rd-q-card .q{font-size:16px;font-weight:700;margin-bottom:10px}
.rd-q-card .opts{display:flex;flex-direction:column;gap:8px}
.rd-q-card .opt{width:100%;text-align:left;font-size:15.5px;padding:10px 14px}
.rd-back{margin-top:6px}
.bld-wrap{max-width:640px;margin:0 auto}
.bld-steps{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bld-step{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--tianline);border-radius:16px;padding:12px 14px}
.bld-step .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.bld-step .tx{font-size:15.5px;font-weight:600;line-height:1.6}
.bld-step .tx small{display:block;color:var(--ink-soft);font-weight:500;font-size:12.5px}
.bld-asks{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cc-card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.cc-model{font-size:18px;font-weight:700;text-align:center;padding:12px;background:var(--sun-soft);border-radius:14px;margin-bottom:10px}
.cc-hint{text-align:center;font-size:13.5px;color:var(--ink-soft);margin:6px 0 10px}
.cc-frames{display:flex;flex-direction:column;gap:8px}
.pinyin-cta .rc-art{background:var(--sky-soft);color:var(--sky-deep)}
.reading-cta .rc-art{background:var(--grass-soft);color:var(--grass-deep)}
.poetry-cta .rc-art{background:var(--brick-soft);color:var(--brick-deep)}
.words-cta .rc-art{background:var(--sun-soft);color:var(--sun-deep)}
.radicals-cta .rc-art{background:var(--sky-soft);color:var(--sky-deep)}

</style>
<style id="cute-theme">
/* ===== 可爱风增强层（统一注入） ===== */
body{font-family:"Yuanti SC","YouYuan","幼圆","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2147480000;opacity:.6;
  background-image:radial-gradient(rgba(255,255,255,.5) 2.2px,transparent 2.7px),radial-gradient(rgba(163,78,15,.05) 2px,transparent 2.5px);
  background-size:36px 36px,58px 58px;background-position:0 0,18px 26px;}
::selection{background:#FFE0AC;color:#4A2B00}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#E8823C55;border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:3px dashed #E8823C;outline-offset:3px;border-radius:14px}
h1,h2,h3{letter-spacing:.02em}
.sec-title::before{content:"";display:inline-block;width:.5em;height:.5em;margin-right:.45em;border-radius:50% 50% 50% 4%;background:#E8823C;transform:rotate(-14deg);vertical-align:.08em}
button,.btn,.tcard,.char-card,.group-card,.unit-card,.unit-row,.card,.opt,.q-opt,.grade-pill,.grade,.tab,.chip-btn,.mini-btn,.pager-btn,.listen-btn,.icon-btn,.iconbtn,.gc-go,.b-btn,.mark,.q-speaker{
  transition:transform .18s cubic-bezier(.34,1.6,.5,1),box-shadow .18s ease,border-color .18s ease !important;}
button{border-radius:999px !important}
.tcard,.char-card,.group-card,.unit-card,.quiz-card,.q-opt,.opt,.unit-row,.sheet,.card{border-radius:24px !important}
.group-card,.char-card,.tcard,.unit-card,.quiz-card,.group-grid>.card{box-shadow:0 6px 0 rgba(70,55,42,.13),0 16px 30px rgba(232,130,60,.20) !important}
.q-opt:hover,.opt:hover,.group-card:hover,.unit-card:hover{transform:translateY(-3px) rotate(-.5deg) !important}
.cute-press{transform:scale(.94) !important}
@keyframes cuteJelly{0%{transform:scale(1)}25%{transform:scale(1.1,.9)}50%{transform:scale(.93,1.06)}75%{transform:scale(1.04,.96)}100%{transform:scale(1)}}
.cute-jelly{animation:cuteJelly .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes cuteFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.f-star,.star,.earned,.lh-star,.big-star,.u-stars,.meter-spark{animation:cuteFloat 3.4s ease-in-out infinite}
@keyframes cuteBlink{0%,92%,100%{opacity:1}96%{opacity:.55}}
.brand>h1,.brand h1{animation:cuteBlink 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .cute-jelly{animation:none}.f-star,.star,.earned,.lh-star,.big-star,.u-stars,.meter-spark,.brand>h1,.brand h1{animation:none}
  button,.btn,.tcard,.char-card,.group-card,.unit-card,.unit-row,.card,.opt,.q-opt,.grade-pill,.grade,.tab,.chip-btn,.mini-btn,.pager-btn,.listen-btn,.icon-btn,.iconbtn,.gc-go,.b-btn,.mark,.q-speaker{transition:none !important}
}
</style>
</head>

<script>
(function(){
'use strict';

/* ============ 数据装载 ============ */

var QB1 = (typeof window !== 'undefined' && window.QUIZ_BANK) ? window.QUIZ_BANK : { lianci:[], fill:[], punct:[], best:[] };

var HAS_TTS = ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance !== 'undefined';

/* 年级模型：GRADES[i] = { key, name, vols:[{ key, name, book, edition, groups }] } */
var GRADES = [];
function buildGradeFromG1(){
  return { key:'g1', name:'一年级', vols:[{ key:'g1a', name:'上册', book:G1.book, edition:G1.edition, groups:G1.groups }] };
}
function buildGradeFromG26(cfg){
  return { key:cfg.key, name:cfg.name, vols:cfg.src.vols.map(function(v){
    return { key:v.key, name:v.name, book:'语文 · ' + v.name, edition:'人教统编版',
      groups:[{ id:v.key, name:'识字表', desc:v.name + ' · 按课分组', units:[] }] };
  }) };
}
var G26_SRC = G26 && G26.grades ? G26.grades : [];
GRADES.push(buildGradeFromG1());
G26_SRC.forEach(function(cfg){
  GRADES.push(buildGradeFromG26({ key:cfg.key, name:cfg.name, src:{ vols:cfg.vols } }));
});
/* 把 g26 的课次挂到 groups 上（用原始 lessons） */
G26_SRC.forEach(function(cfg){
  var grade = GRADES.filter(function(x){ return x.key === cfg.key; })[0];
  cfg.vols.forEach(function(v, vi){
    var group = grade.vols[vi].groups[0];
    v.lessons.forEach(function(les, li){
      var uid = v.key + '-L' + (li+1);
      group.units.push({ id:uid, label:'第' + (li+1) + '课', title:(les.title || les.label || ('第' + (li+1) + '课')), chars:les.chars });
    });
  });
});
/* 通用挂载字段 */
GRADES.forEach(function(grade){
  grade.vols.forEach(function(vol){
    vol.total = 0; vol.chars = [];
    vol.groups.forEach(function(group, gi){
      group.units.forEach(function(u, ui){
        u._group = group; u._vol = vol; u._grade = grade;
        u.chars.forEach(function(row){
          row.hz = row[0]; row.py = row[1]; row.ci = row[2]; row.st = row[3];
          row.w3 = (typeof WORDS3 !== 'undefined' && WORDS3[row.hz]) ? WORDS3[row.hz]
                 : (typeof WORDS3_G26 !== 'undefined' && WORDS3_G26[row.hz]) ? WORDS3_G26[row.hz] : null;
          row.gid = group.id; row.uid = u.id; row.gi = gi; row.ui = ui;
          row.volKey = vol.key; row.gradeKey = grade.key;
          vol.total++; vol.chars.push(row);
        });
      });
    });
  });
});

/* 当前选择的年级/册 */
var curGrade = 'g1';
var curVol = {};            /* gradeKey -> volKey */
var DATA = null;            /* 当前册的适配对象（供既有渲染函数复用） */
var QB = { lianci:[], fill:[], punct:[], best:[] };
var dataOK = false;

function gradeByKey(k){ var out = null; GRADES.forEach(function(g){ if (g.key === k) out = g; }); return out; }
function volByKey(gk, vk){ var g = gradeByKey(gk); if (!g) return null; var out = null; g.vols.forEach(function(v){ if (v.key === vk) out = v; }); return out; }
function curVolKey(){ return curVol[curGrade] || gradeByKey(curGrade).vols[0].key; }
function curVolObj(){ return volByKey(curGrade, curVolKey()); }

/* 把当前册包装成既有渲染函数认识的 DATA 形状 */
function bindVolume(volKey){
  var g = gradeByKey(curGrade);
  var vol = volByKey(curGrade, volKey || curVolKey());
  if (!vol) return;
  curVol[curGrade] = vol.key;
  DATA = { book: vol.book, edition: vol.edition, groups: vol.groups, _vol: vol };
  dataOK = !!(DATA && DATA.groups && DATA.groups.length);
  QB = (curGrade === 'g1') ? QB1 : QB26;
  var bank = (curGrade === 'g1')
    ? (typeof READING_BANK !== 'undefined' ? READING_BANK : null)
    : (typeof READING_BANK_G26 !== 'undefined' ? READING_BANK_G26 : null);
  window.READING = bank;
}

/* ============ 状态（每年级独立存储：yuwenG1_ ~ yuwenG6_） ============ */
var STATE_FIELDS = ['known','unknown','seen','stars','pinyinStars','readed'];
function freshState(){
  return { known:{}, unknown:{}, seen:{}, stars:{}, pinyinStars:{}, readed:{}, lastGroup:null, lastUnit:null };
}
var state = freshState();
function lsKeyFor(gradeKey){ return 'yuwen' + gradeKey.toUpperCase().replace('G','G') + '_state_v1'; }
var LS_KEY = lsKeyFor('g1');
function loadState(){
  LS_KEY = lsKeyFor(curGrade);
  state = freshState();
  if (!dataOK) return;
  try{
    var raw = localStorage.getItem(LS_KEY);
    if (raw){
      var s = JSON.parse(raw);
      if (s && typeof s === 'object'){
        STATE_FIELDS.forEach(function(k){
          state[k] = (s[k] && typeof s[k] === 'object') ? s[k] : {};
        });
        state.lastGroup = (typeof s.lastGroup === 'string') ? s.lastGroup : null;
        state.lastUnit = (typeof s.lastUnit === 'string') ? s.lastUnit : null;
      }
    }
  }catch(e){}
}
var saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }, 120);
}

/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}
function shuffle(a){ for (var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function allChars(){ var out = []; if (!DATA) return out; DATA.groups.forEach(function(g){ g.units.forEach(function(u){ u.chars.forEach(function(r){ out.push(r); }); }); }); return out; }
function findUnit(uid){ var out = null; DATA.groups.forEach(function(g){ g.units.forEach(function(u){ if (u.id === uid) out = u; }); }); return out; }
function findGroup(gid){ var out = null; DATA.groups.forEach(function(g){ if (g.id === gid) out = g; }); return out; }
function unitStats(u){ var k = 0; u.chars.forEach(function(r){ if (state.known[r.hz]) k++; }); return { total:u.chars.length, known:k, pct:u.chars.length ? Math.round(k*100/u.chars.length) : 0 }; }
function groupStats(g){ var t = 0, k = 0; g.units.forEach(function(u){ t += u.chars.length; u.chars.forEach(function(r){ if (state.known[r.hz]) k++; }); }); return { total:t, known:k, pct:t ? Math.round(k*100/t) : 0 }; }
function groupStars(g){ var n = 0; g.units.forEach(function(u){ if (state.stars[u.id]) n++; }); return n; }

/* 朗读（zh-CN） */
function speak(text, onEnd){
  if (!HAS_TTS || !text) { if (onEnd) onEnd(); return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.78; u.pitch = 1.05;
    var vs = speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++){
      if (/zh|Chinese|中文/i.test(vs[i].lang + ' ' + vs[i].name)) { u.voice = vs[i]; break; }
    }
    if (onEnd) u.onend = onEnd;
    speechSynthesis.speak(u);
  }catch(e){ if (onEnd) onEnd(); }
}

/* SVG 图标（不用 emoji） */
var I = {

  starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>',

  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>',
  wind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>',

  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};
var GC = {
  qimeng:{ main:'#E8823C', soft:'var(--sun-soft)',   deep:'#9c5207', line:'#eec27f', doodle:I.sun  },
  pinyin:{ main:'#A9CFE8', soft:'var(--sky-soft)',   deep:'#2f6b93', line:'#9cc0da', doodle:I.wind },
  kewen:{ main:'#8FBB5F',  soft:'var(--grass-soft)', deep:'#4f7a2b', line:'#a9c886', doodle:I.leaf },
  jinjie:{ main:'#D0452A', soft:'var(--brick-soft)', deep:'#a83220', line:'#e0a08f', doodle:I.book }
};
function gc(gid){ return GC[gid] || GC.qimeng; }

/* ============ 罗盘 ============ */
function renderBadges(){
  var all = allChars();
  var known = 0, unknown = 0;
  all.forEach(function(r){ if (state.known[r.hz]) known++; else if (state.unknown[r.hz]) unknown++; });
  var total = all.length;
  $('knownNow').textContent = known;
  $('stKnown').textContent = known;
  $('stFuzzy').textContent = unknown;
  $('stNew').textContent = Math.max(total - known - unknown, 0);
  $('rcKnown').textContent = known;
  $('reviewCnt').textContent = known;
  var pct = total ? Math.round(known*100/total) : 0;
  var wrap = $('totalBarWrap');
  wrap.setAttribute('aria-valuemax', String(total));
  wrap.setAttribute('aria-valuenow', String(known));
  $('totalBar').style.width = pct + '%';
  var tn = $('totalNow'); if (tn) tn.textContent = total;
  $('meterRow').innerHTML = DATA.groups.map(function(g){
    var st = groupStats(g), c = gc(g.id);
    return '<div class="meter"><div class="k">' + esc(g.name) + '</div>' +
      '<div class="v">' + st.known + ' <small>/ ' + st.total + ' 字</small></div>' +
      '<div class="bar"><i style="width:' + st.pct + '%;background:' + c.main + '"></i></div></div>';
  }).join('');
}

/* ============ 首页：4 大板块贴纸卡 ============ */
function renderHome(){
  var g = gradeByKey(curGrade);
  $('bookLine').textContent = (DATA.book || '语文识字台') + ' · ' + (DATA.edition || '') + ' · 共 ' + (DATA._vol ? DATA._vol.total : allChars().length) + ' 字';
  $('groupGrid').innerHTML = DATA.groups.map(function(g, i){
    var c = gc(g.id), st = groupStats(g), stars = groupStars(g);
    return '<button class="group-card" type="button" data-gid="' + esc(g.id) + '" style="--gc-line:' + c.line + ';--gc-soft:' + c.soft + ';--gc-deep:' + c.deep + ';--gc-main:' + c.main + '">' +
      '<span class="gc-chip">板块 ' + (i+1) + '</span>' +
      '<h3><span class="gc-doodle">' + c.doodle + '</span>' + esc(g.name) + '</h3>' +
      '<p>' + esc(g.desc) + ' · ' + g.units.length + ' 课</p>' +
      '<span class="gc-bar"><span class="bar"><i style="width:' + st.pct + '%"></i></span>' +
      '<span class="gc-bar-meta"><span>会 ' + st.known + ' / ' + st.total + ' 字</span>' +
      '<span class="stars">' + I.star + stars + '</span></span></span>' +
      '<span class="gc-go">' + I.arrowR + '</span>' +
    '</button>';
  }).join('');
  $('groupGrid').querySelectorAll('[data-gid]').forEach(function(btn){
    btn.addEventListener('click', function(){ openGroup(btn.getAttribute('data-gid')); });
  });
}

/* ============ 学一学 · 课次列表 ============ */
function openGroup(gid){
  var g = findGroup(gid); if (!g) return;
  state.lastGroup = gid; state.lastUnit = null; saveState();
  var c = gc(gid), st = groupStats(g);
  $('learnBody').innerHTML =
    '<div class="subhead"><div><h2 style="color:' + c.deep + '">' + esc(g.name) + '</h2>' +
    '<p>' + esc(g.desc) + ' · 共 ' + st.total + ' 字，已会 ' + st.known + ' 个</p></div>' +
    '<button class="btn quiet" id="backHome" type="button">' + I.arrowL + ' 回首页</button></div>' +
    '<div class="unit-grid">' + g.units.map(function(u){
      var s = unitStats(u), done = s.pct === 100, starred = !!state.stars[u.id];
      return '<button class="unit-card" type="button" data-uid="' + esc(u.id) + '" style="--uc-line:' + c.line + ';--uc-deep:' + c.deep + ';--uc-main:' + c.main + '">' +
        '<span class="u-top"><span class="u-label">' + esc(u.label) + '</span>' +
        '<span class="u-star' + (starred ? ' earned' : '') + '" aria-label="' + (starred ? '已获得星星' : '还没得到星星') + '">' + (starred ? I.star : I.starO) + '</span></span>' +
        '<h3>' + esc(u.title) + '</h3>' +
        '<span class="u-meta"><span class="bar"><i style="width:' + s.pct + '%;background:' + (done ? 'var(--grass)' : c.main) + '"></i></span>' +
        '<span class="u-nums"><span>' + s.total + ' 个字</span><span class="' + (done ? 'done' : '') + '">' + (done ? '已通关' : '会 ' + s.known + ' 个') + '</span></span></span>' +
      '</button>';
    }).join('') + '</div>';
  $('backHome').addEventListener('click', function(){ switchTab('home'); });
  $('learnBody').querySelectorAll('[data-uid]').forEach(function(btn){
    btn.addEventListener('click', function(){ openLesson(btn.getAttribute('data-uid')); });
  });
  switchTab('learn');
}

/* ============ 学一学 · 某一课（按课次分页：一次只挂一课的字卡） ============ */
function openLesson(uid){
  var u = findUnit(uid); if (!u) return;
  state.lastUnit = uid; state.lastGroup = u.gid; saveState();
  var g = u._group, c = gc(g.id), s = unitStats(u);
  var list = g.units;
  var pos = list.indexOf(u);
  var prev = pos > 0 ? list[pos-1] : null;
  var next = pos < list.length-1 ? list[pos+1] : null;
  var starred = !!state.stars[u.id];

  $('learnBody').innerHTML =
    '<div class="lesson-bar">' +
      '<button class="pager-btn" id="backGroup" type="button">' + I.arrowL + ' ' + esc(g.name) + '</button>' +
      '<span class="lesson-pos">第 ' + (pos+1) + ' / ' + list.length + ' 课</span>' +
      '<span class="pager-btns">' +
        '<button class="pager-btn" id="prevLesson" type="button"' + (prev ? '' : ' disabled') + '>' + I.arrowL + ' 上一课</button>' +
        '<button class="pager-btn" id="nextLesson" type="button"' + (next ? '' : ' disabled') + '>下一课 ' + I.arrowR + '</button>' +
      '</span>' +
    '</div>' +
    '<div class="lesson-head">' +
      '<div><h2><span class="u-label" style="background:' + c.soft + ';color:' + c.deep + '">' + esc(u.label) + '</span> ' + esc(u.title) + '</h2>' +
      '<p class="lh-meta">' + s.total + ' 个字 · 点字卡翻面听读音，学会了就贴上「我会了」' + (s.pct === 100 ? ' · 本课全部通关！' : '') + '</p></div>' +
      '<div class="lh-actions">' +
        '<span class="lh-star' + (starred ? ' earned' : '') + '">' + (starred ? I.star : I.starO) + (starred ? '已得星星' : '测验全对得星星') + '</span>' +
        '<button class="btn primary" id="lessonQuiz" type="button">' + I.eye + ' 这课测一测（5 题）</button>' +
      '</div>' +
    '</div>' +
    '<div class="char-grid" id="charGrid">' + charCards(u.chars) + '</div>' +
    '<div class="lesson-bar" style="margin-top:20px">' +
      '<button class="pager-btn" id="prevLesson2" type="button"' + (prev ? '' : ' disabled') + '>' + I.arrowL + ' 上一课</button>' +
      '<button class="pager-btn" id="nextLesson2" type="button"' + (next ? '' : ' disabled') + '>下一课 ' + I.arrowR + '</button>' +
    '</div>';

  $('backGroup').addEventListener('click', function(){ openGroup(g.id); });
  $('lessonQuiz').addEventListener('click', function(){ startQuiz({ type:'lesson', uid:u.id }); });
  if (prev) { $('prevLesson').addEventListener('click', function(){ openLesson(prev.id); }); $('prevLesson2').addEventListener('click', function(){ openLesson(prev.id); }); }
  if (next) { $('nextLesson').addEventListener('click', function(){ openLesson(next.id); }); $('nextLesson2').addEventListener('click', function(){ openLesson(next.id); }); }

  /* 翻卡事件（事件委托） */
  var grid = $('charGrid');
  grid.addEventListener('click', function(e){
    var okBtn = e.target.closest('[data-act="mark"]');
    if (okBtn){ e.stopPropagation(); toggleKnown(okBtn.getAttribute('data-hz'), okBtn); return; }
    var spBtn = e.target.closest('[data-act="speak"]');
    if (spBtn){ e.stopPropagation(); speak(spBtn.getAttribute('data-say')); return; }
    var stBtn = e.target.closest('[data-act="stroke"]');
    if (stBtn){ e.stopPropagation(); openStroke(stBtn.getAttribute('data-hz')); return; }
    var card = e.target.closest('.char-card');
    if (card) flipCard(card);
  });
  switchTab('learn');
}
function wordListHTML(r){
  var ws = r.w3 || [r.ci];
  return ws.map(function(w, i){
    return '<span class="w"><span class="no">' + (i+1) + '</span>' + esc(w) + '</span>';
  }).join('');
}
/* ===== 笔顺舞台（hanzi-writer 离线数据） ===== */
var HW_READY = (typeof HanziWriter !== 'undefined' && (typeof STROKE_DATA !== 'undefined' || typeof STROKE_DATA_G26 !== 'undefined'));
function strokeDataOf(ch){
  if (typeof STROKE_DATA !== 'undefined' && STROKE_DATA[ch]) return STROKE_DATA[ch];
  if (typeof STROKE_DATA_G26 !== 'undefined' && STROKE_DATA_G26[ch]) return STROKE_DATA_G26[ch];

/* ============ 测验引擎 v2：对照三本教辅的多题型混合 ============
 * 字词题（听写选字/看拼音选字/组词补字）按识字表现场生成（默写高手思路）
 * 句子题（连词成句/选词填空/标点）来自 quiz-bank.js（5·3句式训练思路）
 * 句子比一比来自 quiz-bank.js best（万能句式思路）
 * 组卷：1/3 字词 + 1/3 句子 + 1/3 比一比，凑不满 5 题时自动回退字词题
 */
var quiz = null;

function bankFor(uid){
  var out = [];
  ['lianci','fill','punct','best'].forEach(function(k){
    (QB[k] || []).forEach(function(q){ if (q.uid === uid) out.push(q); });
  });
  return out;
}
function bankGlobal(){
  var out = [];
  ['lianci','fill','punct','best'].forEach(function(k){ (QB[k] || []).forEach(function(q){ out.push(q); }); });
  return out;
}
/* 题型标签（用于进度点提示） */
var TYPE_NAME = { listen:'听写选字', pinyin:'看拼音选字', ci:'组词补字', lianci:'连词成句', fill:'选词填空', punct:'标点符号', best:'句子比一比' };

/* —— 字词题生成（按识字表） —— */
function genWordQ(r, kind, dPool){
  if (kind === 'listen'){
    /* 听写选字：听词语，选汉字（对齐"默写高手"听写） */
    var ds = shuffle(dPool.filter(function(x){ return x.hz !== r.hz && x.hz.length === r.hz.length; }).slice()).slice(0, 2);
    if (ds.length < 2) ds = shuffle(dPool.filter(function(x){ return x.hz !== r.hz; })).slice(0, 2);
    var opts = shuffle(ds.map(function(x){ return { v:x.hz, ok:false }; }).concat([{ v:r.hz, ok:true }]));
    return { t:'listen', r:r, prompt:'听一听，是哪个字或词？', say:r.ci, opts:opts };
  }
  if (kind === 'pinyin'){
    /* 看拼音选字：给出拼音，选汉字 */
    var syllable = r.py.split(' ')[0];
    var ds = shuffle(dPool.filter(function(x){ return x.hz !== r.hz && x.py.split(' ')[0] !== syllable; })).slice(0, 2);
    var opts = shuffle(ds.map(function(x){ return { v:x.hz, ok:false }; }).concat([{ v:r.hz, ok:true }]));
    return { t:'pinyin', r:r, prompt:'哪个字读「' + syllable + '」？', syllable:syllable, opts:opts };
  }
  /* 组词补字：词里缺一个字，从选项里补（对齐"会默更会用"） */
  var ci = r.ci;
  var idx = -1;
  for (var i = 0; i < ci.length; i++){ if (ci[i] === r.hz){ idx = i; break; } }
  if (idx < 0){ /* 组词不含本字则退化为拼音题 */ return genWordQ(r, 'pinyin', dPool); }
  var blanked = ci.slice(0, idx) + '（　）' + ci.slice(idx + 1);
  var ds = shuffle(dPool.filter(function(x){ return x.hz !== r.hz && ci.indexOf(x.hz) < 0; })).slice(0, 2);
  var opts = shuffle(ds.map(function(x){ return { v:x.hz, ok:false }; }).concat([{ v:r.hz, ok:true }]));
  return { t:'ci', r:r, prompt:'把词语补充完整：', blanked:blanked, say:ci, opts:opts };
}

/* —— 测验入口（课次测验 / 复习抽查共用） —— */
function startQuiz(cfg){
  var pool, label, origin;
  if (cfg.type === 'lesson'){
    var u = findUnit(cfg.uid); if (!u) return;
    var g = u._group;
    pool = u.chars.slice();
    var dPool = [];
    g.units.forEach(function(x){ x.chars.forEach(function(r){ dPool.push(r); }); });
    label = u.label + ' · ' + u.title;
    origin = 'learn';
    quiz = buildQuiz(pool, dPool, 5, { type:'lesson', uid:u.id, label:label, origin:origin });
  } else {
    var knownChars = allChars().filter(function(r){ return state.known[r.hz]; });
    if (!knownChars.length){ switchTab('review'); paintReview(); return; }
    pool = shuffle(knownChars.slice());
    quiz = buildQuiz(pool, allChars(), Math.min(5, pool.length), { type:'review', label:'复习抽查', origin:'review' });
  }
  paintQuiz();
  switchTab('quiz');
}

/* —— 组卷 —— */
function buildQuiz(pool, dPool, n, meta){
  var qs = [];
  var qid = meta.uid ? bankFor(meta.uid) : [];
  var gbank = (meta.type === 'review') ? bankGlobal() : qid;
  /* 三类各占一部分：字词 / 句子题库 / 兜底字词 */
  var nWord = Math.ceil(n / 3), nBank = Math.min(qid.length, n - nWord);
  if (meta.type === 'review'){ nBank = Math.ceil(n / 3); nWord = n - nBank; }
  nWord = Math.max(nWord, 0);
  var words = shuffle(pool.slice());
  var wUsed = 0;
  /* 字词题：三种题型轮换 */
  var kinds = ['listen','pinyin','ci'];
  for (var i = 0; i < nWord && wUsed < words.length; i++, wUsed++){
    qs.push(genWordQ(words[wUsed], kinds[i % 3], dPool));
  }
  /* 句子题库题：洗牌后取用（不重复） */
  var bankPool = shuffle(gbank.slice());
  for (var j = 0; j < nBank && j < bankPool.length; j++){
    qs.push(bankPool[j]);
  }
  /* 不足补字词题 */
  while (qs.length < n && wUsed < words.length){
    qs.push(genWordQ(words[wUsed], kinds[qs.length % 3], dPool));
    wUsed++;
  }
  /* 句子题库题也不够时，重复利用全局题库（复习模式） */
  if (qs.length < n && meta.type === 'review'){
    var more = shuffle(bankGlobal()).slice(0, n - qs.length);
    more.forEach(function(q){ if (qs.indexOf(q) < 0) qs.push(q); });
  }
  shuffle(qs);
  return { meta:meta, qs:qs, idx:0, right:0, wrongList:[], rightList:[] };
}

  host.innerHTML =

function confetti(host){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var colors = ['#F2A63C','#E8823C','#8FBB5F','#A9CFE8','#D0452A'];
  var host2 = host.querySelector('.confetti-host') || host.appendChild(Object.assign(document.createElement('span'), { className:'confetti-host' }));
  for (var i = 0; i < 14; i++){
    var s = document.createElement('i');
    var ang = (Math.PI * 2) * (i / 14) + Math.random() * .4;
    var dist = 90 + Math.random() * 110;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', (Math.sin(ang) * dist + 60) + 'px');
    s.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * .12) + 's';
    host2.appendChild(s);
  }
  setTimeout(function(){ if (host2.parentNode) host2.parentNode.removeChild(host2); }, 1000);
}

function genDrillQs(kind, n){
  var pool = allChars().filter(function(r){ return r.py && r.ci && r.ci !== r.hz; });
  var qs = [];
  var picked = shuffle(pool.slice()).slice(0, n);
  picked.forEach(function(r){
    if (kind === 'pinyin'){
      var syllable = r.py.split(' ')[0];
      var ds = shuffle(pool.filter(function(x){ return x.hz !== r.hz && x.py.split(' ')[0] !== syllable; })).slice(0, 2);
      var opts = shuffle(ds.map(function(x){ return { v:x.hz, ok:false }; }).concat([{ v:r.hz, ok:true }]));
      qs.push({ t:'pchoose', ask:'哪个字读「' + syllable + '」？', opts:opts, a:r.hz, answered:false, tip:r.hz + '（' + r.py + '）· ' + r.ci, say:r.hz + '，' + r.ci });
    } else if (kind === 'ci'){
      var ci = r.ci, idx = ci.indexOf(r.hz);
      if (idx < 0){ idx = 0; ci = r.hz + r.ci; }
      var blanked = ci.slice(0, idx) + '（　）' + ci.slice(idx + 1);
      var ds = shuffle(pool.filter(function(x){ return x.hz !== r.hz && ci.indexOf(x.hz) < 0; })).slice(0, 2);
      var opts = shuffle(ds.map(function(x){ return { v:x.hz, ok:false }; }).concat([{ v:r.hz, ok:true }]));
      qs.push({ t:'pchoose', ask:'把词语补充完整：' + blanked, opts:opts, a:r.hz, answered:false, tip:r.hz + '（' + r.py + '）· ' + r.ci, say:ci });
    } else if (kind === 'listen'){
      var ds2 = shuffle(pool.filter(function(x){ return x.hz !== r.hz; })).slice(0, 2);
      var opts2 = shuffle(ds2.map(function(x){ return { v:x.hz, ok:false }; }).concat([{ v:r.hz, ok:true }]));
      qs.push({ t:'plisten', ask:'听一听，是哪个字或词？', opts:opts2, a:r.hz, answered:false, py:r.ci, tip:r.hz + '（' + r.py + '）· ' + r.ci });
    }
  });
  return qs;
}
function startDrill(lvId){
  var label, qs, starKey;
  if (lvId === 'dr2'){ qs = genDrillQs('pinyin', 6); label = '看拼音选字'; starKey = 'dr2'; }
  else if (lvId === 'dr3'){ qs = genDrillQs('ci', 6); label = '组词补字'; starKey = 'dr3'; }
  else if (lvId === 'dr4'){ qs = genDrillQs('listen', 6); label = '听音辨字'; starKey = 'dr4'; }
  else { qs = shuffle(genDrillQs('pinyin', 4).concat(genDrillQs('ci', 3), genDrillQs('listen', 3))); label = '综合挑战'; starKey = 'dr5'; }
  pyQuiz = { qs:qs, idx:0, right:0, label:label + ' · ' + (curVolObj() ? curVolObj().name : ''), starKey:starKey };
  paintPyQuiz();
}

function startRadicalGame(fam, mine){
  var host = $('rfHost');
  var decoys = [];
  var pool = allChars();
  var guard = 0;
  while (decoys.length < 4 && guard < 500){
    guard++;
    var c = pool[Math.floor(Math.random() * pool.length)].hz;
    if (fam.chars.indexOf(c) < 0 && decoys.indexOf(c) < 0) decoys.push(c);
  }
  var targets = shuffle(mine.slice(0, 6));
  var all = shuffle(targets.concat(decoys));
  host.innerHTML =
    '<div class="pq-shell"><div class="pq-card" id="rfCard">' +
      '<div class="quiz-top"><span>部首归类 · ' + esc(fam.name) + '</span><span>把属于「' + esc(fam.r) + '」的字送进家族</span></div>' +

      '<div class="rd-pool" id="rfPool">' +
        all.map(function(c){ return '<button class="chip" type="button" data-hz="' + esc(c) + '" data-ok="' + (targets.indexOf(c) >= 0 ? '1' : '0') + '">' + esc(c) + '</button>'; }).join('') +

      '<div class="quiz-feed" id="rfFeed" aria-live="polite"></div>' +
      '<div class="quiz-actions"><button class="btn primary" id="rfDone" type="button" style="visibility:hidden">完成归类</button></div>' +
    '</div>' +
    '<div style="text-align:center;margin-top:14px"><button class="btn ghost sm" id="rfBack" type="button">' + I.arrowL + ' 回部首屋</button></div></div>';
  $('rfBack').addEventListener('click', function(){ host.innerHTML = ''; paintRadicals(); });
  var need = targets.length, got = 0;
  $('rfPool').querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.disabled) return;
      var ok = b.getAttribute('data-ok') === '1';
      b.disabled = true;
      if (ok){
        got++;
        b.classList.add('used');
        var s = document.createElement('span');
        s.className = 'picked';
        s.textContent = b.textContent;
        $('rfDrop').appendChild(s);
        $('rfFeed').className = 'quiz-feed good';
        if (got >= need){
          $('rfFeed').innerHTML = I.check + ' 全部成员归位！';
          $('rfDone').style.visibility = 'visible';
          confetti($('rfCard'));
          state.readed['rf:' + curVolKey() + ':' + fam.r] = 1; saveState();
        } else {
          $('rfFeed').innerHTML = I.check + ' ' + esc(b.textContent) + ' 回家啦！还差 ' + (need - got) + ' 个';
        }
      } else {
        b.disabled = false;
        $('rfFeed').className = 'quiz-feed bad';
        $('rfFeed').innerHTML = I.cross + ' ' + esc(b.textContent) + ' 不属于「' + esc(fam.r) + '」家族';
      }
    });
  });
  $('rfDone').addEventListener('click', function(){ toast(fam.name + ' 归类完成！'); host.innerHTML = ''; paintRadicals(); });
  window.scrollTo({ top: document.getElementById('rfHost').offsetTop - 20, behavior: 'smooth' });
}

    var allDone = host.querySelectorAll('.rd-q-card._done').length >= rd.qs.length;
    if (allDone){
      clearInterval(checkDone);
      state.readed[key] = 1; saveState();
      var chip = $('rdDone'); if (chip) chip.textContent = Object.keys(state.readed).length;
      toast('阅读完成！文章卡已点亮');
      host.querySelectorAll('.rd-q-card').forEach(function(c){ c.classList.add('_finished'); });
    }
  }, 600);
  window.scrollTo({ top: document.getElementById('rdHost').offsetTop - 20, behavior:'smooth' });
}
function openBuilder(bd){
  var host = $('rdHost');
  host.innerHTML =
    '<div class="bld-wrap"><div class="cc-card">' +
      '<div style="text-align:center;font-size:56px;font-family:var(--font-kai);font-weight:700;color:var(--orange-deep)">' + esc(bd.hz) + '</div>' +
      '<div class="bld-steps">' +
        bd.steps.map(function(s, i){ return '<div class="bld-step"><span class="no">' + (i+1) + '</span><span class="tx">' + esc(s.split('：')[0]) + '<small>' + esc(s.split('：')[1] || '') + '</small></span></div>'; }).join('') +
      '</div>' +
      '<div class="bld-asks">' +
        bd.asks.map(function(a, ai){
          return '<div class="rd-q-card" data-ai="' + ai + '"><div class="q">' + esc(a.q) + '</div>' +
            '<div class="opts">' + a.opts.map(function(o, oi){ return '<button class="opt" type="button" data-oi="' + oi + '">' + esc(o) + '</button>'; }).join('') + '</div></div>';
        }).join('') +
      '</div>' +
      '<div class="rd-back" style="margin-top:14px"><button class="btn ghost sm" id="bldBack" type="button">' + I.arrowL + ' 回阅读列表</button></div>' +
    '</div></div>';
  $('bldBack').addEventListener('click', function(){ host.innerHTML = ''; paintReading(); });
  host.querySelectorAll('.rd-q-card').forEach(function(card){
    var ai = parseInt(card.getAttribute('data-ai'), 10);
    var a = bd.asks[ai];
    card.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        if (card._done) return;
        card._done = true;
        var oi = parseInt(b.getAttribute('data-oi'), 10);
        var ok = a.opts[oi] === a.a;
        card.querySelectorAll('.opt').forEach(function(bb, bi){
          bb.disabled = true;
          if (a.opts[bi] === a.a) bb.classList.add('right');
          if (bb === b && !ok) bb.classList.add('wrong');
        });
        if (ok){ confetti(card); speak(a.a); } else { toast('再想想哦，跟着阶梯一步步来'); }
      });
    });
  });
  window.scrollTo({ top: document.getElementById('rdHost').offsetTop - 20, behavior:'smooth' });
}
function openCopycat(cc){
  var host = $('rdHost');
  host.innerHTML =
    '<div class="bld-wrap"><div class="cc-card">' +
      '<div class="cc-model">' + esc(cc.model) + '</div>' +
      '<p class="cc-hint">' + esc(cc.ask) + ' · ' + esc(cc.hint) + '</p>' +
      '<div class="rd-q-card"><div class="q">先听例子，再照着说</div>' +
        '<div class="opts">' + cc.frames.map(function(f){ return '<button class="opt" type="button" data-f="' + esc(f) + '">' + esc(f) + '</button>'; }).join('') + '</div>' +
      '</div>' +
      '<p class="st-note">玩法：点一句听一遍，然后合上屏幕，让小朋友照着句式自己说一句新的，说对了给她竖个大拇指！</p>' +
      '<div class="rd-back" style="margin-top:10px"><button class="btn ghost sm" id="ccBack" type="button">' + I.arrowL + ' 回阅读列表</button></div>' +
    '</div></div>';
  $('ccBack').addEventListener('click', function(){ host.innerHTML = ''; paintReading(); });
  host.querySelectorAll('.cc-frames .opt, .rd-q-card .opt').forEach(function(b){
    b.addEventListener('click', function(){ speak(b.getAttribute('data-f') || b.textContent); });
  });
  window.scrollTo({ top: document.getElementById('rdHost').offsetTop - 20, behavior:'smooth' });
}

/* ============ 导航 ============ */
function switchTab(name){
  ['home','learn','review','quiz','pinyin','reading','poetry','words','radicals'].forEach(function(t){
    var v = $('view-' + t), tab = $('tab-' + t);
    if (v) v.classList.toggle('active', t === name);
    if (tab){
      var sel = (t === name) || (name === 'quiz' && ((quiz && quiz.meta.origin === 'review' && t === 'review') || ((quiz && quiz.meta.origin === 'learn') && t === 'learn')));
      tab.setAttribute('aria-selected', sel ? 'true' : 'false');
    }
  });
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============ 启动 ============ */
function renderGradeBar(){
  document.querySelectorAll('#gradeBar .grade-pill').forEach(function(p){
    var k = p.getAttribute('data-grade');
    var g = gradeByKey(k);
    var tag = $('gpTag-' + k);
    if (tag && g){
      var t = 0; g.vols.forEach(function(v){ t += v.total; });
      tag.textContent = (t / 10000 >= 1 ? '' : '') + t + ' 字';
    }
    p.setAttribute('aria-pressed', k === curGrade ? 'true' : 'false');
  });
}
function renderVolBar(){
  var bar = $('volBar');
  var g = gradeByKey(curGrade);
  if (!bar || !g) return;
  if (g.vols.length <= 1){ bar.classList.remove('show'); bar.innerHTML = ''; return; }
  bar.classList.add('show');
  var ck = curVolKey();
  bar.innerHTML = g.vols.map(function(v){
    return '<button class="vol-chip" type="button" data-vol="' + v.key + '" aria-pressed="' + (v.key === ck ? 'true' : 'false') + '">' +
      esc(v.name) + '<span class="vc-n">' + v.total + '字</span></button>';
  }).join('');
  bar.querySelectorAll('[data-vol]').forEach(function(b){
    b.addEventListener('click', function(){
      var vk = b.getAttribute('data-vol');
      if (vk === curVolKey()) return;
      curVol[curGrade] = vk;
      switchGrade(curGrade, vk, true);
    });
  });
}
function switchGrade(gk, vk, isVolSwitch){
  curGrade = gk;
  bindVolume(vk || gradeByKey(gk).vols[0].key);
  loadState();
  renderGradeBar();
  renderVolBar();
  renderBadges();
  renderHome();
  paintReview();
  var pyChip = $('pyStars'); if (pyChip) pyChip.textContent = Object.keys(state.pinyinStars).length;
  var rdChip = $('rdDone'); if (rdChip) rdChip.textContent = Object.keys(state.readed).length;
  $('pinyinBody').innerHTML = ''; $('readingBody').innerHTML = '';
  $('poetryBody').innerHTML = ''; $('wordsBody').innerHTML = ''; $('radicalsBody').innerHTML = '';
  switchTab('home');
  if (!isVolSwitch) toast(gk === 'g1' ? '一年级上册' : gradeByKey(gk).name + ' · ' + (curVolObj() ? curVolObj().name : ''));
}
function boot(){
  if (!(G1 && G1.groups) || !(G26 && G26.grades)){
    document.querySelector('.app').innerHTML =
      '<div class="state-card error"><div class="sc-art">' + I.cross + '</div>' +
      '<h3>识字表没装上</h3><p>页面需要同目录的 shengzi-data.js 和 shengzi-data-g26.js。把它们放回本文件旁边，再刷新一次就好。</p></div>';
    return;
  }
  bindVolume('g1a');
  loadState();
  /* 年级切换 */
  document.querySelectorAll('#gradeBar .grade-pill').forEach(function(p){
    p.addEventListener('click', function(){
      var k = p.getAttribute('data-grade');
      if (k === curGrade) return;
      switchGrade(k);
    });
  });
  $('tab-home').addEventListener('click', function(){ switchTab('home'); });
  $('tab-learn').addEventListener('click', function(){
    if (state.lastUnit && findUnit(state.lastUnit)) openLesson(state.lastUnit);
    else if (state.lastGroup && findGroup(state.lastGroup)) openGroup(state.lastGroup);
    else openGroup(DATA.groups[0].id);
  });
  $('tab-review').addEventListener('click', function(){ paintReview(); switchTab('review'); });
  $('tab-pinyin').addEventListener('click', function(){ paintPinyin(); switchTab('pinyin'); });
  $('tab-reading').addEventListener('click', function(){ paintReading(); switchTab('reading'); });
  $('tab-poetry').addEventListener('click', function(){ paintPoetry(); switchTab('poetry'); });
  $('tab-words').addEventListener('click', function(){ paintWords(); switchTab('words'); });
  $('tab-radicals').addEventListener('click', function(){ paintRadicals(); switchTab('radicals'); });
  var goPy = $('goPinyin'); if (goPy) goPy.addEventListener('click', function(){ paintPinyin(); switchTab('pinyin'); });
  var goRd = $('goReading'); if (goRd) goRd.addEventListener('click', function(){ paintReading(); switchTab('reading'); });
  var goPm = $('goPoetry'); if (goPm) goPm.addEventListener('click', function(){ paintPoetry(); switchTab('poetry'); });
  var goWd = $('goWords'); if (goWd) goWd.addEventListener('click', function(){ paintWords(); switchTab('words'); });
  var goRf = $('goRadicals'); if (goRf) goRf.addEventListener('click', function(){ paintRadicals(); switchTab('radicals'); });
  $('goReview').addEventListener('click', function(){ paintReview(); switchTab('review'); });
  /* 键盘翻卡支持 */
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest && e.target.closest('.char-card');
    if (card && e.target === card){ e.preventDefault(); flipCard(card); }
  });
  /* TTS 声音列表异步加载 */
  if (HAS_TTS){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){}; }catch(e){} }

  renderGradeBar();
  renderVolBar();
  renderBadges();
  renderHome();
  paintReview();
  var pyChip = $('pyStars'); if (pyChip) pyChip.textContent = Object.keys(state.pinyinStars).length;
  var rdChip = $('rdDone'); if (rdChip) rdChip.textContent = Object.keys(state.readed).length;
  refreshExtraBadges();
}
function refreshExtraBadges(){
  var pmN = 0, rfN = 0, wdN = 0;
  Object.keys(state.readed).forEach(function(k){
    if (k.indexOf('pm:') === 0) pmN++;
    if (k.indexOf('rf:') === 0) rfN++;
  });
  Object.keys(state.pinyinStars).forEach(function(k){
    if (k.indexOf('wd:') === 0) wdN++;
  });
  var a = $('pmDone'); if (a) a.textContent = pmN;
  var b = $('wdDone'); if (b) b.textContent = wdN;
  var c = $('rfDone'); if (c) c.textContent = rfN;
}
boot();
})();
</script>

<script id="cute-js">
(function(){
  "use strict";
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var SEL = "button,.btn,.tcard,.char-card,.group-card,.unit-card,.unit-row,.opt,.q-opt,.mark,.tab,.grade-pill,.grade,.chip-btn,.mini-btn,.listen-btn,.gc-go";
  function pick(e){ var t = e.target && e.target.closest ? e.target.closest(SEL) : null; return t || null; }
  document.addEventListener("pointerdown", function(e){ var t = pick(e); if (t) t.classList.add("cute-press"); }, true);
  function release(e){
    var t = pick(e); if (!t) return;
    t.classList.remove("cute-press");
    if (!t.classList.contains("cute-jelly")) {
      t.classList.add("cute-jelly");
      setTimeout(function(){ t.classList.remove("cute-jelly"); }, 540);
    }
  }
  document.addEventListener("pointerup", release, true);
  document.addEventListener("pointercancel", function(e){ var t = pick(e); if (t) t.classList.remove("cute-press"); }, true);
})();
</script>
